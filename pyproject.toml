[project]
name = "resumen-clase"
version = "0.1.0"
description = "Transcribe + resumir clases virtuales (Meet) con IA local"
requires-python = ">=3.13,<3.14"
dependencies = [
    "faster-whisper>=1.0.3",
    "soundcard>=0.4.3",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "flet[all]==0.86.0",
    "markitdown[pdf,docx,pptx]>=0.0.1a3",
    "openai>=1.40",
]

[project.scripts]
resumen = "main_cli:app"
resumen-gui = "gui.main:run"

[project.gui-scripts]
ResumenClase = "gui.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resumen_clase", "src/gui"]

[tool.hatch.build.targets.wheel.force-include]
"main_cli.py" = "main_cli.py"

[tool.flet.app]
path = "."
module = "main_gui.py"
exclude = [
    ".agents",
    ".codex",
    ".flet",
    ".git",
    ".idea",
    ".venv",
    "output",
    "referencias",
]
